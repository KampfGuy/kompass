// Kompass VR (Meta Quest / Horizon OS) — Android shell that hosts the shared KampfScript runtime from ../src.
// The web bundle (app/src/main/assets/www) is generated by ../vr/build-web.js before every build.
import groovy.json.JsonSlurper
plugins { id 'com.android.application' }

def vr = new JsonSlurper().parse(file('../../vr/version.json'))
def ks = System.getenv('KOMPASS_VR_KEYSTORE') ?: (project.findProperty('kompassVrKeystore') ?: '')

android {
    namespace 'com.kampfguy.kompass.vr'
    compileSdk 34
    defaultConfig {
        applicationId vr.applicationId
        minSdk 29          // Quest 1/2/Pro/3/3S all run Android 10 (API 29) or newer
        targetSdk 32       // Horizon OS (Android 12L based) — the level Meta asks Quest apps to target
        versionCode vr.versionCode
        versionName vr.versionName
    }
    signingConfigs {
        kompassVr {
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KOMPASS_VR_KEYSTORE_PASS') ?: 'android'
                keyAlias System.getenv('KOMPASS_VR_KEY_ALIAS') ?: 'kompassvr'
                keyPassword System.getenv('KOMPASS_VR_KEYSTORE_PASS') ?: 'android'
            }
        }
    }
    buildTypes {
        debug {
            if (ks && file(ks).exists()) signingConfig signingConfigs.kompassVr
        }
        release {
            minifyEnabled false
            if (ks && file(ks).exists()) signingConfig signingConfigs.kompassVr
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
    // keep .mp4/.ks/.md uncompressed-friendly and readable as streams
    androidResources { noCompress += ['mp4', 'webm'] }
}

tasks.register('buildWebBundle', Exec) {
    workingDir file('../..')
    commandLine 'node', 'vr/build-web.js', file('src/main/assets/www').absolutePath
}
preBuild.dependsOn 'buildWebBundle'
